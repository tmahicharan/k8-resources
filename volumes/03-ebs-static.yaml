apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 15Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-07936a553120345f1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi

---

apiVersion: v1
kind: Pod
metadata: 
 name: nginx
labels:
  purpose: ebs-static
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  nodeselector:
    topology.kubernetes.io/zone: us-east-1a
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
     claimName: ebs-static

---
apiVersion: v1
kind: Service
metadata:
 name: nginx
spec:
  type: LoadBalancer
  selector:
   purpose: ebs-static
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007

 
    
