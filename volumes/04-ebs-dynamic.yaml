apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  storageClassName: ebs-sc 
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

---

apiVersion: v1
kind: Pod
metadata: 
 name: nginx
 labels:
   purpose: ebs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
     claimName: ebs-dynamic

---
apiVersion: v1
kind: Service
metadata:
 name: nginx
spec:
  type: LoadBalancer
  selector:
   purpose: ebs-dynamic
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007

 
    
